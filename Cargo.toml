[workspace]
resolver = "2"

members = [
    "crates/ai-brains-core",
    "crates/ai-brains-events",
    "crates/ai-brains-contracts",
    "crates/ai-brains-control-plane",
    "crates/ai-brains-sources",
    "crates/ai-brains-crypto",
    "crates/ai-brains-sync",
    "crates/ai-brains-store",
    "crates/ai-brains-path",
    "crates/ai-brains-git",
    "crates/ai-brains-security",
    "crates/ai-brains-capture",
    "crates/ai-brains-adapters",
    "crates/ai-brains-daemon-api",
    "crates/ai-brains-api-server",
    "crates/ai-brainsd",
    "crates/ai-brains-cli",
    "crates/ai-brains-retrieval",
    "crates/ai-brains-graph",
    "crates/ai-brains-models",
    "crates/ai-brains-brain",
    "crates/ai-brains-scheduler",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.2"
authors = ["AI-Brains Contributors"]
edition = "2024"
# Project terms: LICENSE (PolyForm Noncommercial 1.0.0) + COMMERCIAL-EXCEPTION.md
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/AI-Brains/AI-Brains"

[workspace.dependencies]
# Common dependencies for future tracks
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.13", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
reqwest = { version = "0.13", features = ["json"] }
async-trait = "0.1"
tempfile = "3.10"
assert_cmd = "2.2"
predicates = "3.1"
# T187: live SQLCipher page encryption (vendored OpenSSL for Windows MSVC CI).
# Do not use bare `bundled` alone — PRAGMA key is a no-op without SQLCipher.
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl", "backup", "fallible_uint", "trace"] }
dotenvy = "0.15"
strip-ansi-escapes = "0.2"
sha2 = "0.11"
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
# T188 F17: zero-echo TTY passphrase for `ai-brains recovery export` (Apache-2.0).
rpassword = "7.5"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
dirs = "6.0"
rand = "0.10"
cap-std = "4.0"
# T190: expose FollowSymlinks::No on OpenOptions (cap-std default is Yes / software follow).
cap-fs-ext = { version = "4.0", features = ["cap-std"] }
# Multi-device replication (T176 / ADR-0018) — classical ECC only; not PQ.
ed25519-dalek = { version = "3", features = ["serde", "zeroize", "rand_core"] }
# NO getrandom feature — panic-free keygen via try_fill_bytes + StaticSecret::from (R25).
x25519-dalek = { version = "3", features = ["serde", "zeroize", "static_secrets"] }
hkdf = "0.13"
axum = "0.8.9"
tower = "0.5"
tower-http = { version = "0.6.6", features = ["limit", "cors", "trace"] }
http-body-util = "0.1"
regex = "1.12"
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }


