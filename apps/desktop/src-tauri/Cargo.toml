[package]
name = "ai-brains-desktop"
version = "0.1.1"
description = "AI-Brains desktop thin client (Tauri v2)"
authors = ["AI-Brains Contributors"]
edition = "2024"
# Product terms: LICENSE (PolyForm Noncommercial 1.0.0) + COMMERCIAL-EXCEPTION.md
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/AI-Brains/AI-Brains"
publish = false

[lib]
name = "ai_brains_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1"
