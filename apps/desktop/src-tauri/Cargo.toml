[package]
name = "ai-brains-desktop"
version = "0.1.2"
description = "AI-Brains desktop thin client (Tauri v2)"
authors = ["AI-Brains Contributors"]
edition = "2024"
# Product terms: LICENSE (PolyForm Noncommercial 1.0.0) + COMMERCIAL-EXCEPTION.md
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/AI-Brains/AI-Brains"
publish = false

[lib]
name = "ai_brains_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["isolation"] }

[dependencies]
tauri = { version = "2.11.5", features = ["isolation"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
httpmock = "0.7"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
